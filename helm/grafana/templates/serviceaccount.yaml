# grafana 的 Helm 模板（serviceaccount.yaml）：經 Helm 渲染後產生部署內容。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# Helm：點號 Values 路徑讀取設定；include 呼叫模板，nindent 縮排；模板左界帶減號會移除前方空白。
{{- if .Values.serviceAccount.create -}}
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: ServiceAccount
# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: {{ include "grafana.serviceAccountName" . }}
  # 鍵值標籤，供 selector、監控或排程控制器識別資源。
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  # 附加設定或提示，由對應控制器解讀，不等同 selector 標籤。
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
