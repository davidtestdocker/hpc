# grafana 的 Helm 模板（test-connection.yaml）：經 Helm 渲染後產生部署內容。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# Helm：點號 Values 路徑讀取設定；include 呼叫模板，nindent 縮排；模板左界帶減號會移除前方空白。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: Pod
# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: "{{ include "grafana.fullname" . }}-test-connection"
  # 鍵值標籤，供 selector、監控或排程控制器識別資源。
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
  # 附加設定或提示，由對應控制器解讀，不等同 selector 標籤。
  annotations:
    "helm.sh/hook": test
# 期望狀態；控制器據此建立或調整實際資源。
spec:
  # Pod 內的容器清單；同一 Pod 的容器共用網路。
  containers:
    - name: wget
      # 容器映像及標籤，決定執行的檔案系統與程式版本。
      image: busybox
      # 覆寫容器入口指令；多行字串中的 Shell 語法由指定的 shell 解讀。
      command: ['wget']
      # 傳給入口程式的參數；YAML 清單的每個元素是一個參數。
      args: ['{{ include "grafana.fullname" . }}:{{ .Values.service.port }}']
  # Pod 內容器退出後的重啟政策。
  restartPolicy: Never
