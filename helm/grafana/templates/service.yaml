# grafana 的 Helm 模板（service.yaml）：經 Helm 渲染後產生部署內容。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# Helm：點號 Values 路徑讀取設定；include 呼叫模板，nindent 縮排；模板左界帶減號會移除前方空白。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: Service
# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: {{ include "grafana.fullname" . }}
  # 鍵值標籤，供 selector、監控或排程控制器識別資源。
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
# 期望狀態；控制器據此建立或調整實際資源。
spec:
  type: {{ .Values.service.type }}
  # 連接埠設定清單；容器宣告埠號本身不會自動對外公開。
  ports:
    - port: {{ .Values.service.port }}
      # Service 將流量轉送至 Pod 的目標埠號或命名埠。
      targetPort: http
      protocol: TCP
      name: http
  # 選取要關聯的物件；不同資源種類支援的 selector 格式不同。
  selector:
    {{- include "grafana.selectorLabels" . | nindent 4 }}
