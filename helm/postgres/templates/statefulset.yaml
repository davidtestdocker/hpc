# postgres 的 Helm 模板（statefulset.yaml）：經 Helm 渲染後產生部署內容。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# Helm：點號 Values 路徑讀取設定；include 呼叫模板，nindent 縮排；模板左界帶減號會移除前方空白。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: apps/v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: StatefulSet

# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: postgres
  # 資源所屬命名空間；叢集層級資源不使用此欄位。
  namespace: {{ .Release.Namespace }}

# 期望狀態；控制器據此建立或調整實際資源。
spec:
  serviceName: {{ .Values.service.name }}
  # 期望副本數；設定為 0 表示不維持執行中的副本。
  replicas: {{ .Values.replicaCount }}

  # 選取要關聯的物件；不同資源種類支援的 selector 格式不同。
  selector:
    # 以完全相等的標籤鍵值選取物件。
    matchLabels:
      app: postgres

  # 子物件模板；控制器以此內容建立 Pod 或相關工作資源。
  template:
    metadata:
      # 鍵值標籤，供 selector、監控或排程控制器識別資源。
      labels:
        app: postgres

    spec:
      # Pod 內的容器清單；同一 Pod 的容器共用網路。
      containers:
        - name: postgres
          # 容器映像及標籤，決定執行的檔案系統與程式版本。
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          # 映像拉取政策，例如 IfNotPresent 允許使用節點快取。
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # 連接埠設定清單；容器宣告埠號本身不會自動對外公開。
          ports:
            - containerPort: {{ .Values.service.port }}

          # 環境變數清單，提供程式啟動時的設定。
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.name | quote }}

            - name: POSTGRES_USER
              # 從其他資源或 Pod 欄位取得環境變數值。
              valueFrom:
                # 引用 Secret 中指定的鍵，而不是直接寫入環境變數值。
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            #如果你有設定 PGDATA就用它，沒有設定就用預設 /var/lib/postgresql/data
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          # 把已宣告的 volume 掛載到容器中的指定路徑。
          volumeMounts:
            - name: postgres-storage
              # 容器內可見的掛載路徑。
              mountPath: {{ .Values.persistence.mountPath }}

      # Pod 可掛載的儲存來源，例如 Secret、ConfigMap 或 PVC。
      volumes:
        - name: postgres-storage
          # 引用 PVC 取得持久化儲存空間。
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName }}
