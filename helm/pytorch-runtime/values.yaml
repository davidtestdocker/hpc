replicaCount: 0

image:
  repository: pytorch/pytorch
  tag: 2.12.0-cuda12.6-cudnn9-runtime
  pullPolicy: IfNotPresent

gpu:
  count: 1

nodeSelector:
  cloud.google.com/gke-nodepool: gpu-pool


ncclBenchmark:
  enabled: true

  # NVIDIA PyTorch container with CUDA/NCCL runtime.
  image: nvcr.io/nvidia/pytorch:26.07-py3

  beginSize: 8K
  endSize: 256M
  factor: 2

  gpusPerProcess: 1
  gpuCount: 1

  ncclDebug: INFO

distributedScaling:
  enabled: true

  # Current lab runs real CPU/Gloo scaling.
  workers: 2

  cpuRequest: "4"
  cpuLimit: "4"
  memoryRequest: "2Gi"
  memoryLimit: "4Gi"
