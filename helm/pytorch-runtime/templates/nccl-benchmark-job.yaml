# pytorch-runtime 的 Helm 模板（nccl-benchmark-job.yaml）：經 Helm 渲染後產生部署內容。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# Helm：點號 Values 路徑讀取設定；include 呼叫模板，nindent 縮排；模板左界帶減號會移除前方空白。
{{- if .Values.ncclBenchmark.enabled }}
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: batch/v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: Job
# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: nccl-benchmark
  # 鍵值標籤，供 selector、監控或排程控制器識別資源。
  labels:
    app: nccl-benchmark
# 期望狀態；控制器據此建立或調整實際資源。
spec:
  # Job 失敗後的重試上限。
  backoffLimit: 1

  # 子物件模板；控制器以此內容建立 Pod 或相關工作資源。
  template:
    metadata:
      labels:
        app: nccl-benchmark

    spec:
      # Pod 內容器退出後的重啟政策。
      restartPolicy: Never

      # Run on the existing GPU node pool.
      # 要求節點具有指定標籤，限制 Pod 可排入的節點。
      nodeSelector:
        cloud.google.com/gke-nodepool: {{ index .Values.nodeSelector "cloud.google.com/gke-nodepool" | quote }}

      # Allow scheduling on the tainted GPU node.
      # 容忍節點 taint；只解除排程限制，不保證會選中該節點。
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule

      # Pod 內的容器清單；同一 Pod 的容器共用網路。
      containers:
        - name: nccl-benchmark
          # 容器映像及標籤，決定執行的檔案系統與程式版本。
          image: {{ .Values.ncclBenchmark.image | quote }}
          # 映像拉取政策，例如 IfNotPresent 允許使用節點快取。
          imagePullPolicy: IfNotPresent

          # 覆寫容器入口指令；多行字串中的 Shell 語法由指定的 shell 解讀。
          command:
            - /bin/bash
            - -c

          # 傳給入口程式的參數；YAML 清單的每個元素是一個參數。
          args:
            - |
              set -e

              echo "=== Clone nccl-tests ==="
              git clone --depth 1 https://github.com/NVIDIA/nccl-tests.git /opt/nccl-tests

              cd /opt/nccl-tests

              echo "=== Build nccl-tests ==="
              make -j"$(nproc)"

              echo "=== Run AllReduce benchmark ==="
              ./build/all_reduce_perf \
                -b {{ .Values.ncclBenchmark.beginSize }} \
                -e {{ .Values.ncclBenchmark.endSize }} \
                -f {{ .Values.ncclBenchmark.factor }} \
                -g {{ .Values.ncclBenchmark.gpusPerProcess }}

          # 環境變數清單，提供程式啟動時的設定。
          env:
            - name: NCCL_DEBUG
              value: {{ .Values.ncclBenchmark.ncclDebug | quote }}

          # 資源設定；Pod 中是 requests／limits，Kustomize 中是待組合的檔案清單。
          resources:
            # 容器可使用的資源上限；GPU 份額的實際意義取決於裝置外掛設定。
            limits:
              # NVIDIA 裝置外掛提供的 GPU 資源單位；time-slicing 時不等同實體卡數。
              nvidia.com/gpu: {{ .Values.ncclBenchmark.gpuCount }}
{{- end }}
