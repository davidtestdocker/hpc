# api 的 Helm 模板（configmap.yaml）：經 Helm 渲染後產生部署內容。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# Helm：點號 Values 路徑讀取設定；include 呼叫模板，nindent 縮排；模板左界帶減號會移除前方空白。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: ConfigMap

# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: {{ include "api.fullname" . }}-config
  # 資源所屬命名空間；叢集層級資源不使用此欄位。
  namespace: {{ .Release.Namespace }}
#quote會強制把值包成字串
# 鍵值資料；Secret 的 data 使用 Base64 編碼，ConfigMap 通常是純文字。
data:
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  POSTGRES_HOST: {{ .Values.config.postgresHost | quote }}
  POSTGRES_PORT: {{ .Values.config.postgresPort | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDb | quote }}
