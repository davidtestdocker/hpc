# prometheus 的 Helm 模板（deployment.yaml）：經 Helm 渲染後產生部署內容。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# Helm：點號 Values 路徑讀取設定；include 呼叫模板，nindent 縮排；模板左界帶減號會移除前方空白。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: apps/v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: Deployment
# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: {{ include "prometheus.fullname" . }}
  # 鍵值標籤，供 selector、監控或排程控制器識別資源。
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
# 期望狀態；控制器據此建立或調整實際資源。
spec:
  # 期望副本數；設定為 0 表示不維持執行中的副本。
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  # 選取要關聯的物件；不同資源種類支援的 selector 格式不同。
  selector:
    # 以完全相等的標籤鍵值選取物件。
    matchLabels:
      {{- include "prometheus.selectorLabels" . | nindent 6 }}
  # 子物件模板；控制器以此內容建立 Pod 或相關工作資源。
  template:
    metadata:
      #只要configmap.yaml內容有變 sha256sum就會變，所以就會偵測到prometheus的deployment有變，就會建新的prometheus pod
      # 附加設定或提示，由對應控制器解讀，不等同 selector 標籤。
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "prometheus.selectorLabels" . | nindent 8 }}
    spec:
      # Pod 使用的 ServiceAccount；RBAC 依此身分授予 API 權限。
      serviceAccountName: prometheus
      #這個 Pod 掛載的 Volume（PVC）都套用這個權限設定
      # 程序身分、權限與作業系統安全設定。
      securityContext:
        fsGroup: 65534
      # Pod 內的容器清單；同一 Pod 的容器共用網路。
      containers:
        - name: prometheus
          # 容器映像及標籤，決定執行的檔案系統與程式版本。
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          # 映像拉取政策，例如 IfNotPresent 允許使用節點快取。
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          # 傳給入口程式的參數；YAML 清單的每個元素是一個參數。
          args:
            #pod裡面容器prometheus程式去讀prometheus.yml這檔案
            - --config.file=/etc/prometheus/prometheus.yml
            #所有Metrics Database 都存到 /prometheus (gke硬碟)  
            - --storage.tsdb.path=/prometheus

          # 連接埠設定清單；容器宣告埠號本身不會自動對外公開。
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          # 就緒探針决定 Pod 是否可接收 Service 流量。
          readinessProbe:
            # 以 HTTP GET 檢查指定路徑與埠號。
            httpGet:
              path: /-/ready
              port: http
            # 容器啟動後等待多少秒才開始探測。
            initialDelaySeconds: 10
            # 探針的執行間隔秒數。
            periodSeconds: 10

          # 存活探針失敗達門檻時，kubelet 會重啟容器。
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15

          # 資源設定；Pod 中是 requests／limits，Kustomize 中是待組合的檔案清單。
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          # 把ConfigMap 裡的所有檔案掛到這個pod的/etc/prometheus路徑
          # 把已宣告的 volume 掛載到容器中的指定路徑。
          volumeMounts:
            - name: prometheus-config
              # 容器內可見的掛載路徑。
              mountPath: /etc/prometheus

            - name: prometheus-data
              mountPath: /prometheus

      #include 裡面是函式 ex:prometheus.fullname 被定義在_helpers.tpl          
      #找 Kubernetes 裡名叫 prometheus 的 ConfigMap
      #建立一個 Volume，名字叫 prometheus-config
      #這個 Volume 的內容就是 ConfigMap 裡的所有檔案
      # Pod 可掛載的儲存來源，例如 Secret、ConfigMap 或 PVC。
      volumes:
        - name: prometheus-config
          configMap:
            name: {{ include "prometheus.fullname" . }}

        - name: prometheus-data
          # 引用 PVC 取得持久化儲存空間。
          persistentVolumeClaim:
            claimName: {{ include "prometheus.fullname" . }}
      # nodeSelector Kubernetes Scheduler可以透過這個將pod被放到有同樣lable的node
      # - toYaml 把 values.yaml 裡的 nodeSelector 整個轉成 YAML，最後產生nodeSelector:workload: observability
      # 要求節點具有指定標籤，限制 Pod 可排入的節點。
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
