# prometheus 的 Helm 模板（pvc.yaml）：經 Helm 渲染後產生部署內容。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# Helm：點號 Values 路徑讀取設定；include 呼叫模板，nindent 縮排；模板左界帶減號會移除前方空白。
{{- if .Values.persistence.enabled }}
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: PersistentVolumeClaim
# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: {{ include "prometheus.fullname" . }}
  # 鍵值標籤，供 selector、監控或排程控制器識別資源。
  labels:
    {{- include "prometheus.labels" . | nindent 4 }}
# 期望狀態；控制器據此建立或調整實際資源。
spec:
  # 儲存卷要求的存取模式，例如 ReadWriteOnce 限制為單節點讀寫掛載。
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  # 指定動態配置儲存使用的 StorageClass。
  storageClassName: {{ .Values.persistence.storageClassName }}
  # 資源設定；Pod 中是 requests／limits，Kustomize 中是待組合的檔案清單。
  resources:
    # 排程器計算需求時採用的資源量；500m CPU 等於 0.5 顆核心。
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
