# prometheus 的 Helm 模板（clusterrolebinding.yaml）：經 Helm 渲染後產生部署內容。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# Helm：點號 Values 路徑讀取設定；include 呼叫模板，nindent 縮排；模板左界帶減號會移除前方空白。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: rbac.authorization.k8s.io/v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: ClusterRoleBinding

# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: prometheus

# RoleBinding 或 ClusterRoleBinding 要授權的使用者／群組／ServiceAccount。
subjects:
  - kind: ServiceAccount
    name: prometheus
    # 資源所屬命名空間；叢集層級資源不使用此欄位。
    namespace: {{ .Release.Namespace }}

# 要綁定的 Role 或 ClusterRole。
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus
