# Kubernetes 資源（api-ingress）：宣告服務、工作負載或實驗設定，需套用到對應叢集才會生效。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: networking.k8s.io/v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: Ingress

# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: api-ingress
  # 資源所屬命名空間；叢集層級資源不使用此欄位。
  namespace: hpc-platform

# 期望狀態；控制器據此建立或調整實際資源。
spec:
  # 規則清單；RBAC 中定義 API 存取權限，Ingress 中定義路由。
  rules:
    - host: api.hpc.local

      http:

        paths:

          - path: /

            pathType: Prefix

            backend:

              service:

                name: api-service

                port:

                  number: 8000
