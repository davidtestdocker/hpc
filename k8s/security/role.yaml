apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: benchmark-reader
  namespace: hpc-platform-dev
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
