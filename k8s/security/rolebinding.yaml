# Kubernetes 安全設定（rolebinding）：身分與權限或網路隔離實驗，實際效果取決於引用身分及叢集控制器。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: rbac.authorization.k8s.io/v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: RoleBinding
# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: benchmark-reader-binding
  # 資源所屬命名空間；叢集層級資源不使用此欄位。
  namespace: hpc-platform-dev
# RoleBinding 或 ClusterRoleBinding 要授權的使用者／群組／ServiceAccount。
subjects:
  - kind: ServiceAccount
    name: benchmark-runner
    namespace: hpc-platform-dev
# 要綁定的 Role 或 ClusterRole。
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: benchmark-reader
