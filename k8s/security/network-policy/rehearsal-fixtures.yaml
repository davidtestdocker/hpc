# 隔離叢集的封包測試 fixtures；使用獨立 namespace，驗收後整個 namespace 刪除。
apiVersion: v1
kind: Namespace
metadata:
  name: network-policy-validation
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: network-policy-validation
  labels:
    app: server
spec:
  containers:
    - name: server
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["netexec", "--http-port=8080"]
      ports:
        - name: http
          containerPort: 8080
  restartPolicy: Never
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: network-policy-validation
spec:
  selector:
    app: server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Pod
metadata:
  name: allowed-client
  namespace: network-policy-validation
  labels:
    access: allowed
spec:
  containers:
    - name: client
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
  restartPolicy: Never
---
apiVersion: v1
kind: Pod
metadata:
  name: denied-client
  namespace: network-policy-validation
  labels:
    access: denied
spec:
  containers:
    - name: client
      image: busybox:1.36.1
      command: ["sh", "-c", "sleep 3600"]
  restartPolicy: Never
