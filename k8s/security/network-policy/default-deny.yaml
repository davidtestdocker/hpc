# Kubernetes 安全設定（default-deny）：身分與權限或網路隔離實驗，實際效果取決於引用身分及叢集控制器。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: networking.k8s.io/v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: NetworkPolicy
# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: default-deny
  # 資源所屬命名空間；叢集層級資源不使用此欄位。
  namespace: hpc-platform-dev
# 期望狀態；控制器據此建立或調整實際資源。
spec:
  # 以標籤指定 NetworkPolicy 套用的 Pod；空映射表示該 namespace 全部 Pod。
  podSelector: {}
  # 此 NetworkPolicy 管控的方向：Ingress 入站或 Egress 出站。
  policyTypes:
    - Ingress
    - Egress
