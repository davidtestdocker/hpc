apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-jobset-runner
  namespace: hpc-platform-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-jobset-runner
  namespace: hpc-platform-dev
rules:
  - apiGroups:
      - jobset.x-k8s.io
    resources:
      - jobsets
    verbs:
      - get
      - list
      - watch
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-jobset-runner
  namespace: hpc-platform-dev
subjects:
  - kind: ServiceAccount
    name: api-jobset-runner
    namespace: hpc-platform-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-jobset-runner
