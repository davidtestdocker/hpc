apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu-cluster-queue
spec:
  namespaceSelector: {}

  preemption:
    withinClusterQueue: LowerPriority

  resourceGroups:
    - coveredResources:
        - cpu
        - nvidia.com/gpu
      flavors:
        - name: l4-timesharing-tas
          resources:
            - name: cpu
              nominalQuota: "3"
            - name: nvidia.com/gpu
              nominalQuota: "4"
