apiVersion: kueue.x-k8s.io/v1beta2
kind: ClusterQueue
metadata:
  name: gpu-cluster-queue
spec:
  namespaceSelector: {}

  queueingStrategy: BestEffortFIFO

  preemption:
    withinClusterQueue: LowerPriority

  resourceGroups:
    - coveredResources:
        - nvidia.com/gpu
      flavors:
        - name: l4-timesharing-tas
          resources:
            - name: nvidia.com/gpu
              nominalQuota: 4
