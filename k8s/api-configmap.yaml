# Kubernetes 資源（api-configmap）：宣告服務、工作負載或實驗設定，需套用到對應叢集才會生效。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: ConfigMap

# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: api-config
  # 資源所屬命名空間；叢集層級資源不使用此欄位。
  namespace: hpc-platform

# 鍵值資料；Secret 的 data 使用 Base64 編碼，ConfigMap 通常是純文字。
data:

  REDIS_HOST: redis-service

  REDIS_PORT: "6379"

  POSTGRES_HOST: postgres-service

  POSTGRES_PORT: "5432"

  POSTGRES_DB: hpc_platform
