# 本機 Docker Compose 服務設定；service 名稱可用於 Compose 網路內的名稱解析。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# Compose 中的服務定義，服務之間可透過名稱互相解析。
services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    # 連接埠設定清單；容器宣告埠號本身不會自動對外公開。
    ports:
      - "8000:8000"
    environment:
      APP_NAME: HPC API Dev
    # Pod 可掛載的儲存來源，例如 Secret、ConfigMap 或 PVC。
    volumes:
      - ./api:/app/api
  redis:
    # 容器映像及標籤，決定執行的檔案系統與程式版本。
    image: redis:7-alpine
    ports:
      - "6379:6379"
    # 覆寫容器入口指令；多行字串中的 Shell 語法由指定的 shell 解讀。
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hpc
      POSTGRES_PASSWORD: hpc_password
      POSTGRES_DB: hpc_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
