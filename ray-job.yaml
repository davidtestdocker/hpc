# 獨立 Ray 範例：向既有叢集提交六個遠端 task，收集各 task 的執行主機。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: ray.io/v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: RayJob
# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: hpc-ray-job
  # 資源所屬命名空間；叢集層級資源不使用此欄位。
  namespace: ray-system

# 期望狀態；控制器據此建立或調整實際資源。
spec:
  # Submit the workload to the existing Ray cluster.
  # 依標籤選取已存在的 RayCluster。
  clusterSelector:
    ray.io/cluster: hpc-ray

  # Command executed by the Ray Jobs API.
  # Ray Jobs API 執行的命令；| 保留換行，下方整段是字串而非 YAML 欄位。
  # 內嵌 Python：@ray.remote 定義遠端 task，num_cpus=1 是 Ray 排程資源需求。
  # .remote(i) 非同步提交，列表生成式建立六筆工作，ray.get 等待並取回所有結果。
  entrypoint: |
    python -c '
    import socket
    import ray

    ray.init()

    @ray.remote(num_cpus=1)
    def work(task_id):
        return {
            "task_id": task_id,
            "hostname": socket.gethostname()
        }

    results = ray.get([work.remote(i) for i in range(6)])

    for result in results:
        print(result)
    '
