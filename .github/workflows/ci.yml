# GitHub Actions 流程：檢查程式、測試、建置與推送映像，再更新 GitOps image tag。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

# 授予工作流程 token 的權限；id-token 可用於雲端身分交換。
permissions:
  contents: write
  id-token: write

# GitHub Actions 的工作清單，每個 job 可有自己的 runner。
jobs:

  test:

    runs-on: ubuntu-latest

    # 依序執行的步驟清單。
    steps:

      - name: Checkout Repository
        # 引用現成 GitHub Action，@ 後方是版本或提交。
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: projects/257719401812/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@project-4b82f780-0a12-4087-b94.iam.gserviceaccount.com
          
      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"

      - name: Install Dependencies

        # 在 runner 上執行 Shell 指令；| 表示保留多行。
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Python Syntax Check

        run: |

          python -m compileall api monitoring

      - name: Ruff Lint

        run: |

          ruff check . --output-format=github


      - name: Run Pytest

        run: |

          python -m pytest

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: asia-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}


      - name: Build Docker Image

        run: |

          docker build \
            -f docker/Dockerfile \
            -t asia-east1-docker.pkg.dev/project-4b82f780-0a12-4087-b94/hpc-images/hpc-api:${{ github.sha }} \
            .

      - name: Push Docker Image
        run: |
          docker push \
            asia-east1-docker.pkg.dev/project-4b82f780-0a12-4087-b94/hpc-images/hpc-api:${{ github.sha }}



      - name: Update Image Tag
        run: |
          sed -i "s/^  tag:.*/  tag: ${{ github.sha }}/" helm/api/values-dev.yaml
          cat helm/api/values-dev.yaml



      - name: Commit GitOps Changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add helm/api/values-dev.yaml

          git commit -m "chore: update image tag [skip ci]" || echo "No changes"

          git push
