name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: projects/257719401812/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions@project-4b82f780-0a12-4087-b94.iam.gserviceaccount.com
          
      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"

      - name: Install Dependencies

        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Python Syntax Check

        run: |

          python -m compileall api monitoring

      - name: Ruff Lint

        run: |

          ruff check . --output-format=github


      - name: Run Pytest

        run: |

          python -m pytest

      - name: Login to Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: asia-east1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}


      - name: Build Docker Image

        run: |

          docker build \
            -f docker/Dockerfile \
            -t asia-east1-docker.pkg.dev/project-4b82f780-0a12-4087-b94/hpc-images/hpc-api:${{ github.sha }} \
            .

      - name: Push Docker Image
        run: |
          docker push \
            asia-east1-docker.pkg.dev/project-4b82f780-0a12-4087-b94/hpc-images/hpc-api:${{ github.sha }}
