# Kubernetes 資源（iperf3-server）：宣告服務、工作負載或實驗設定，需套用到對應叢集才會生效。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: Pod
# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: iperf3-server
  # 資源所屬命名空間；叢集層級資源不使用此欄位。
  namespace: hpc-platform-dev
  # 鍵值標籤，供 selector、監控或排程控制器識別資源。
  labels:
    app: iperf3-server

# 期望狀態；控制器據此建立或調整實際資源。
spec:
  # Pod 內容器退出後的重啟政策。
  restartPolicy: Never

  # 要求節點具有指定標籤，限制 Pod 可排入的節點。
  nodeSelector:
    cloud.google.com/gke-nodepool: primary-pool

  # Pod 內的容器清單；同一 Pod 的容器共用網路。
  containers:
  - name: iperf3

    # 容器映像及標籤，決定執行的檔案系統與程式版本。
    image: networkstatic/iperf3

    # 傳給入口程式的參數；YAML 清單的每個元素是一個參數。
    args:
      - "-s"

    # 連接埠設定清單；容器宣告埠號本身不會自動對外公開。
    ports:
      - containerPort: 5201
