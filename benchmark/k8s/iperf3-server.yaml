apiVersion: v1
kind: Pod
metadata:
  name: iperf3-server
  namespace: hpc-platform-dev
  labels:
    app: iperf3-server

spec:
  restartPolicy: Never

  nodeSelector:
    cloud.google.com/gke-nodepool: primary-pool

  containers:
  - name: iperf3

    image: networkstatic/iperf3

    args:
      - "-s"

    ports:
      - containerPort: 5201
