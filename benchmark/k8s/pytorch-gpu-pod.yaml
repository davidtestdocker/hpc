apiVersion: v1
kind: Pod

metadata:
  name: pytorch-gpu
  namespace: hpc-platform-dev

spec:
  restartPolicy: Never

  # Run only on the GPU node pool
  nodeSelector:
    cloud.google.com/gke-nodepool: gpu-pool

  # Allow scheduling onto the GPU node
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: present
      effect: NoSchedule

  containers:
    - name: pytorch

      # Official PyTorch image with CUDA runtime
      image: pytorch/pytorch:2.12.0-cuda12.6-cudnn9-runtime

      # Keep the container running for interactive experiments
      command:
        - sleep
        - infinity

      resources:
        limits:
          # Request one NVIDIA GPU
          nvidia.com/gpu: 1
