# Kubernetes 資源（dcgm-exporter-remote）：宣告服務、工作負載或實驗設定，需套用到對應叢集才會生效。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: apps/v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: DaemonSet

# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: dcgm-exporter
  # 資源所屬命名空間；叢集層級資源不使用此欄位。
  namespace: hpc-platform-dev

# 期望狀態；控制器據此建立或調整實際資源。
spec:
  # 選取要關聯的物件；不同資源種類支援的 selector 格式不同。
  selector:
    # 以完全相等的標籤鍵值選取物件。
    matchLabels:
      app: dcgm-exporter

  # 子物件模板；控制器以此內容建立 Pod 或相關工作資源。
  template:
    metadata:
      # 鍵值標籤，供 selector、監控或排程控制器識別資源。
      labels:
        app: dcgm-exporter

    spec:
      # 要求節點具有指定標籤，限制 Pod 可排入的節點。
      nodeSelector:
        cloud.google.com/gke-nodepool: gpu-pool

      # 容忍節點 taint；只解除排程限制，不保證會選中該節點。
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule

      # Pod 可掛載的儲存來源，例如 Secret、ConfigMap 或 PVC。
      volumes:
        - name: nvidia-install-dir-host
          hostPath:
            path: /home/kubernetes/bin/nvidia
            type: Directory

        - name: pod-gpu-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
            type: Directory

      # Pod 內的容器清單；同一 Pod 的容器共用網路。
      containers:
        - name: dcgm-exporter

          # 容器映像及標籤，決定執行的檔案系統與程式版本。
          image: nvcr.io/nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless

          # 環境變數清單，提供程式啟動時的設定。
          env:
            - name: DCGM_REMOTE_HOSTENGINE_INFO
              value: "tcp://nvidia-dcgm:5555"

            - name: DCGM_EXPORTER_KUBERNETES
              value: "true"

            - name: DCGM_EXPORTER_DEBUG
              value: "true"

            - name: DCGM_EXPORTER_ENABLE_DCGM_LOG
              value: "true"

            - name: DCGM_EXPORTER_DCGM_LOG_LEVEL
              value: "DEBUG"

          # 連接埠設定清單；容器宣告埠號本身不會自動對外公開。
          ports:
            - name: metrics
              containerPort: 9400

          # 程序身分、權限與作業系統安全設定。
          securityContext:
            capabilities:
              add:
                - SYS_ADMIN

          # 把已宣告的 volume 掛載到容器中的指定路徑。
          volumeMounts:
            - name: nvidia-install-dir-host
              # 容器內可見的掛載路徑。
              mountPath: /usr/local/nvidia
              # 是否以唯讀方式掛載，限制容器透過此掛載點寫入。
              readOnly: true

            - name: pod-gpu-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
