apiVersion: apps/v1
kind: DaemonSet

metadata:
  name: dcgm-exporter
  namespace: hpc-platform-dev

spec:
  selector:
    matchLabels:
      app: dcgm-exporter

  template:
    metadata:
      labels:
        app: dcgm-exporter

    spec:
      nodeSelector:
        cloud.google.com/gke-nodepool: gpu-pool

      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule

      volumes:
        - name: nvidia-install-dir-host
          hostPath:
            path: /home/kubernetes/bin/nvidia
            type: Directory

        - name: pod-gpu-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
            type: Directory

      containers:
        - name: dcgm-exporter

          image: nvcr.io/nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless

          env:
            - name: DCGM_REMOTE_HOSTENGINE_INFO
              value: "tcp://nvidia-dcgm:5555"

            - name: DCGM_EXPORTER_KUBERNETES
              value: "true"

            - name: DCGM_EXPORTER_DEBUG
              value: "true"

            - name: DCGM_EXPORTER_ENABLE_DCGM_LOG
              value: "true"

            - name: DCGM_EXPORTER_DCGM_LOG_LEVEL
              value: "DEBUG"

          ports:
            - name: metrics
              containerPort: 9400

          securityContext:
            capabilities:
              add:
                - SYS_ADMIN

          volumeMounts:
            - name: nvidia-install-dir-host
              mountPath: /usr/local/nvidia
              readOnly: true

            - name: pod-gpu-resources
              mountPath: /var/lib/kubelet/pod-resources
              readOnly: true
