# Kubernetes 資源（nvidia-dcgm）：宣告服務、工作負載或實驗設定，需套用到對應叢集才會生效。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: apps/v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: DaemonSet

# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: nvidia-dcgm
  # 資源所屬命名空間；叢集層級資源不使用此欄位。
  namespace: hpc-platform-dev

# 期望狀態；控制器據此建立或調整實際資源。
spec:
  # 選取要關聯的物件；不同資源種類支援的 selector 格式不同。
  selector:
    # 以完全相等的標籤鍵值選取物件。
    matchLabels:
      app: nvidia-dcgm

  # 子物件模板；控制器以此內容建立 Pod 或相關工作資源。
  template:
    metadata:
      # 鍵值標籤，供 selector、監控或排程控制器識別資源。
      labels:
        app: nvidia-dcgm

    spec:
      # Only schedule this Pod onto GPU nodes
      # 要求節點具有指定標籤，限制 Pod 可排入的節點。
      nodeSelector:
        cloud.google.com/gke-nodepool: gpu-pool

      # Allow scheduling onto the GPU node taint
      # 容忍節點 taint；只解除排程限制，不保證會選中該節點。
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: present
          effect: NoSchedule

      # Pod 可掛載的儲存來源，例如 Secret、ConfigMap 或 PVC。
      volumes:
        # GKE-managed NVIDIA driver directory on the GPU node
        - name: nvidia-install-dir-host
          hostPath:
            path: /home/kubernetes/bin/nvidia
            type: Directory

      # Pod 內的容器清單；同一 Pod 的容器共用網路。
      containers:
        - name: nvidia-dcgm
          # 容器映像及標籤，決定執行的檔案系統與程式版本。
          image: nvcr.io/nvidia/cloud-native/dcgm:3.3.0-1-ubuntu22.04

          # Start DCGM HostEngine and listen on all interfaces
          # 覆寫容器入口指令；多行字串中的 Shell 語法由指定的 shell 解讀。
          command:
            - nv-hostengine
            - -n
            - -b
            - ALL

          # 連接埠設定清單；容器宣告埠號本身不會自動對外公開。
          ports:
            - name: dcgm
              containerPort: 5555
              hostPort: 5555

          # Google GKE reference deployment uses privileged mode
          # 程序身分、權限與作業系統安全設定。
          securityContext:
            privileged: true

          # 把已宣告的 volume 掛載到容器中的指定路徑。
          volumeMounts:
            # Make GKE's NVIDIA driver libraries available inside the container
            - name: nvidia-install-dir-host
              # 容器內可見的掛載路徑。
              mountPath: /usr/local/nvidia
