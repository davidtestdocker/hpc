    \u76EE\u524D\u9650\u5236\u3002\n\n---\n\n# HPC AI Performance Engineering Platform\n\
    \n## Overview\n\n\u4EE5 API \u9A45\u52D5 distributed HPC\uFF0FAI workload submission\u3001\
    scheduling\u3001execution \u8207\u7D50\u679C\u56DE\u6536\uFF0C\u7D50\u5408 observability\u3001\
    performance analysis \u548C failure troubleshooting \u7684\u5DE5\u7A0B\u4F5C\u54C1\
    \u3002\n\n\u4E3B\u5C55\u793A\u662F FastAPI \u2192 Redis \u2192 \u81EA\u52D5 worker\
    \ \u2192 Kubernetes JobSet\uFF0FKueue \u2192 MPI ranks \u2192 \u81EA\u52D5\u7D50\
    \u679C\u56DE\u6536\uFF1BRay\u3001Slurm\u3001NCCL \u8207\u6548\u80FD\u5BE6\u9A57\
    \u63D0\u4F9B\u5E73\u884C\u7684 supporting evidence\u30022026-09-22 \u5DF2\u9A57\
    \u8B49\u80CC\u666F polling reconciliation\u3001worker \u91CD\u555F\u63A5\u7E8C\
    \u8207\u4E09\u6B21\u6A21\u64EC dispatch \u5931\u6557\u5F8C\u56DE\u5831 failed\uFF1B\
    artifact storage \u5C1A\u672A\u5B8C\u6210\u3002\u898B [\u81EA\u52D5\u6D41\u7A0B\
    \u8B49\u64DA](docs/evidence/automatic-worker-20260922.json)\u3002\n\n## Architecture\n\
    \n```mermaid\nflowchart LR\n    C[\"Client\"] --> A[\"FastAPI\"]\n    A --> D[\"\
    PostgreSQL: initial metadata\"]\n    A --> R[\"Redis: job state / queue\"]\n \
    \   R --> W[\"Worker / Dispatcher\"]\n    W --> K[\"Kubernetes API\"]\n    K -->|\"\
    poll terminal state / launcher log\"| W\n    W -->|\"result\"| R\n    W -->|\"\
    status\"| D\n    K --> J[\"JobSet\"]\n    J --> Q[\"Kueue admission\"]\n    Q\
    \ --> M[\"MPI launcher + workers\"]\n```\n\nWorker \u70BA\u7368\u7ACB Deployment\uFF0C\
    \u6BCF\u4E94\u79D2\u8F2A\u8A62\u6301\u4E45\u5316 job records\uFF0C\u81EA\u52D5\
    \u63D0\u4EA4\u4E26\u56DE\u6536 JobSet \u7D42\u614B\u3001launcher log \u8207 ranks\u3002\
    \u4E3B overlay \u5DF2\u505C\u7528\u624B\u52D5 worker endpoints\u3002Kueue \u8655\
    \u7406 queue\uFF0Fquota\uFF0FTAS admission\uFF1BJobSet \u7BA1\u7406 distributed\
    \ job grouping\uFF1Badmission \u5F8C\u7531 Kubernetes Scheduler \u5B8C\u6210 Pod\
    \ placement\u3002\u64CD\u4F5C\u898B [\u81EA\u52D5 worker runbook](docs/runbooks/automatic-worker.md)\u3002\
    \n\n\u5B8C\u6574\u5206\u5DE5\u8207 Node Pool \u908A\u754C\u898B [Final Architecture](docs/architecture/platform-architecture.md)\u3002\
    \n\n## Main Demo\n\n`POST /benchmark` \u2192 Redis queue \u2192 worker dispatch\
    \ \u2192 \u52D5\u614B `mpi-<job_id>` JobSet \u2192 Kueue admission \u2192 1 launcher\
    \ + 3 workers \u2192 3 MPI ranks\u3002\n\n\u5DF2\u4FDD\u5B58\u6210\u529F JobSet\
    \ `mpi-52eedc2a-f6b1-4c97-9c11-529223ed6899` \u8207 rank 0\uFF0F1\uFF0F2 \u8F38\
