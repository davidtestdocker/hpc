    \u5C0D\u61C9\u5230\u771F\u5BE6 scripts\u3001manifests\u3001JSON\uFF0Flog \u8207\
    \ historical records\uFF0C\u9010\u9805\u6A19\u793A verified scope \u548C limitation\u3002\
    \u6B77\u53F2\u7D50\u679C\u4E0D\u4EE3\u8868\u76EE\u524D cluster \u5373\u6642\u72C0\
    \u614B\u3002\n\n## Current Boundary\n\n**\u5DF2\u5B8C\u6210\uFF1A** API submission\
    \ \u2192 queue \u2192 dispatch \u2192 Kueue admission \u2192 MPI ranks \u2192\
    \ terminal condition\uFF0Frank collection \u2192 Redis\uFF0FPostgreSQL completed\u3002\
    \n\n**\u5C1A\u672A\u5B8C\u6210\uFF1A** artifact object storage\u3001\u8DE8 Redis\uFF0F\
    PostgreSQL \u539F\u5B50\u4EA4\u6613\u3001\u5B8C\u6574 lifecycle state machine\
    \ \u8207 Kubernetes watch\u3002\u80CC\u666F polling reconciliation \u5DF2\u5BE6\
    \u6E2C\u5B8C\u6210\uFF1B\u5176\u4ED6 benchmark \u5206\u652F\u4ECD\u70BA simulated\u3002\
    Redis \u8CC7\u6599\u5168\u5931\u6062\u5FA9\u8207 exactly-once \u672A\u4FDD\u8B49\
    \u3002\u5355 GPU \u74B0\u5883\u4E0D\u4E3B\u5F35 multi-GPU\uFF0Fmulti-node scaling\u3002\
    \n\n## Repository Structure\n\n```text\napi/          FastAPI\u3001database\u3001\
    MPI renderer\uFF0Fdispatcher\nbenchmark/    Benchmark scripts \u8207\u4FDD\u5B58\
    \u7D50\u679C\nruntime/      PyTorch\uFF0FvLLM runtime adapters\nk8s/         \
    \ Scheduling\u3001security\u3001workload manifests\nhelm/         Service\uFF0F\
    runtime\uFF0Fmonitoring charts\nkustomize/    Deployment overlays\nterraform/\
    \    Infrastructure modules \u8207 environments\nanalysis/     Performance analyzer\n\
    docs/        Architecture\u3001demos\u3001evidence\u3001reports\u3001\u6B77\u53F2\
    \u7D00\u9304\n```\n\n## Demo Quick Start\n\n1. \u5148\u5B8C\u6210 [Demo prerequisite](docs/demo/end-to-end-mpi-jobset-demo.md)\uFF1A\
    \u78BA\u8A8D cluster context\u3001namespace\u3001\u5E73\u53F0\u670D\u52D9\u3001\
    JobSet\uFF0FKueue\uFF0Fqueues\u3001SSH Secret \u8207 DB init\u3002\u6B64\u8655\
    \u5047\u8A2D\u5E73\u53F0\u5DF2\u90E8\u7F72\u4E14\u53EF\u7528\uFF0C\u5B8C\u6574\
    \u8A2D\u5B9A\u898B\u8A72\u6587\u4EF6\u3002\n2. \u53E6\u958B terminal \u4FDD\u6301\
    \ API port-forward\uFF1A\n\n```bash\nkubectl port-forward -n hpc-platform-dev\
    \ service/api-service 8000:8000\n```\n\n3. \u63D0\u4EA4 MPI \u5DE5\u4F5C\uFF0C\
    \u8A18\u4E0B\u56DE\u50B3\u7684 `job_id`\uFF1A\n\n```bash\ncurl -sS -X POST http://127.0.0.1:8000/benchmark\
    \ \\\n  -H 'Content-Type: application/json' -d '{\"benchmark\":\"mpi\"}'\n```\n\
    \n4. Worker \u81EA\u52D5\u8655\u7406\uFF1B\u4F7F\u7528\u672C\u6B21 `job_id` \u67E5\
    \u8A62 `status` \u8207 `result.jobset_name`\uFF1A\n\n```bash\ncurl -sS \"http://127.0.0.1:8000/jobs/<job_id>\"\
    \n```\n\n5. \u5C07\u4E0B\u9762 placeholder \u66FF\u63DB\u70BA\u672C\u6B21\u56DE\
    \u50B3\u7684 JobSet name\uFF0C\u67E5\u770B admission \u5F8C\u662F\u5426 `SUSPENDED=false`\uFF1A\
    \n\n```bash\nMPI_JOBSET='mpi-<job_id>'\nkubectl get jobset \"$MPI_JOBSET\" -n\
    \ hpc-platform-dev\n```\n\n6. Launcher \u555F\u52D5\u5F8C\u67E5\u770B\u8A72 child\
    \ Job \u7684 log\uFF0C\u78BA\u8A8D rank 0\uFF0F1\uFF0F2\uFF1A\n\n```bash\nkubectl\
    \ logs -n hpc-platform-dev \"job/${MPI_JOBSET}-launcher-0\" -c launcher\n```\n\
    \n7. JobSet \u7D50\u675F\u5F8C worker \u81EA\u52D5\u56DE\u6536\u7D50\u679C\uFF0C\
    \u518D\u4EE5\u63D0\u4EA4\u6642\u53D6\u5F97\u7684 `job_id` \u67E5\u8A62\uFF1A\n\
    \n```bash\ncurl -sS \"http://127.0.0.1:8000/jobs/<job_id>\"\n```\n\n\u56DE\u61C9\
    \u61C9\u5305\u542B `status: completed`\u3001JobSet terminal condition \u8207 `ranks:\
    \ [0, 1, 2]`\u3002\n\n## Limitations / Future Improvements\n\n\u5F8C\u7E8C\u6539\
    \u5584\u96C6\u4E2D\u65BC result artifact storage\u3001\u8DE8\u8CC7\u6599\u5EAB\
    \u4E00\u81F4\u6027\u3001\u975E\u7A7A Redis \u5099\u4EFD\u9084\u539F\u3001Alembic\
    \ schema migration\uFF0C\u4EE5\u53CA IaC\uFF0FGitOps alignment\u3002\u81EA\u52D5\
    \ worker\u3001Redis PVC \u8207 graceful Pod replacement \u5DF2\u9A57\u8B49\u3002\
    Multi-node GPU\uFF0FRDMA performance \u9700\u53E6\u5099\u786C\u9AD4\u8207\u9A57\
    \u8B49\u3002\n"
kind: ConfigMap
metadata:
  name: causal-lm-20260922-a
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: causal-lm-benchmark
  name: causal-lm-20260922-a
spec:
  activeDeadlineSeconds: 1200
  containers:
  - command:
    - sh
    - -c
    - python /benchmark/causal_lm_benchmark.py && sleep 900
    image: pytorch/pytorch:2.12.0-cuda12.6-cudnn9-runtime
    name: benchmark
    resources:
      limits:
        cpu: '4'
        memory: 10Gi
        nvidia.com/gpu: '1'
      requests:
        cpu: '2'
        memory: 6Gi
        nvidia.com/gpu: '1'
    volumeMounts:
    - mountPath: /benchmark
      name: script
      readOnly: true
    - mountPath: /results
      name: results
  nodeSelector:
    cloud.google.com/gke-nodepool: gpu-pool
  restartPolicy: Never
  tolerations:
  - effect: NoSchedule
    key: nvidia.com/gpu
    operator: Equal
    value: present
  volumes:
  - configMap:
      name: causal-lm-20260922-a
    name: script
  - emptyDir: {}
    name: results
