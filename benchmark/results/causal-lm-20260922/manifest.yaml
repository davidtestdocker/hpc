  causal_lm_benchmark.py: "\"\"\"Small byte-token causal LM: controlled batch comparison\
    \ and separate CUDA traces.\"\"\"\nimport gzip\nimport hashlib\nimport json\n\
    import math\nimport os\nimport platform\nimport statistics\nimport subprocess\n\
    import threading\nimport time\nfrom datetime import datetime, timezone\nfrom pathlib\
    \ import Path\n\nimport torch\nfrom torch.profiler import ProfilerActivity, profile,\
    \ record_function\n\nSEED = 20260922\nSEQ = 256\nHIDDEN = 512\nLAYERS = 4\n\n\n\
    class CausalLM(torch.nn.Module):\n    def __init__(self):\n        super().__init__()\n\
    \        self.tokens = torch.nn.Embedding(256, HIDDEN)\n        self.positions\
    \ = torch.nn.Embedding(SEQ, HIDDEN)\n        layer = torch.nn.TransformerEncoderLayer(\n\
    \            HIDDEN, 8, HIDDEN * 4, dropout=0.0, activation='gelu',\n        \
    \    batch_first=True, norm_first=True,\n        )\n        self.blocks = torch.nn.TransformerEncoder(layer,\
    \ LAYERS, enable_nested_tensor=False)\n        self.norm = torch.nn.LayerNorm(HIDDEN)\n\
    \        self.head = torch.nn.Linear(HIDDEN, 256, bias=False)\n        self.register_buffer('mask',\
    \ torch.triu(torch.ones(SEQ, SEQ, dtype=torch.bool), 1))\n\n    def forward(self,\
    \ tokens):\n        length = tokens.shape[1]\n        x = self.tokens(tokens)\
    \ + self.positions(torch.arange(length, device=tokens.device))\n        x = self.blocks(x,\
    \ mask=self.mask[:length, :length], is_causal=True)\n        return self.head(self.norm(x))\n\
    \n\ndef step(model, optimizer, batches, number):\n    x, y = batches[number %\
    \ len(batches)]\n    with record_function('train.zero_grad'):\n        optimizer.zero_grad(set_to_none=True)\n\
    \    with record_function('train.forward_loss'), torch.autocast('cuda', dtype=torch.bfloat16):\n\
    \        logits = model(x)\n        loss = torch.nn.functional.cross_entropy(logits.reshape(-1,\
    \ 256), y.reshape(-1))\n    with record_function('train.backward'):\n        loss.backward()\n\
    \    with record_function('train.optimizer'):\n        optimizer.step()\n    return\
    \ loss.detach()\n\n\ndef prepare(corpus, batch):\n    torch.manual_seed(SEED)\n\
    \    torch.cuda.manual_seed_all(SEED)\n    model = CausalLM().cuda().train()\n\
    \    optimizer = torch.optim.AdamW(model.parameters(), lr=3e-4)\n    # Same ordered\
    \ examples for both settings; batch 16 groups twice as many examples.\n    generator\
    \ = torch.Generator().manual_seed(SEED + 1)\n    starts = torch.randint(len(corpus)\
    \ - SEQ, (128,), generator=generator)\n    windows = torch.stack([corpus[s:s +\
    \ SEQ + 1] for s in starts]).cuda()\n    batches = [(windows[i:i + batch, :-1],\
    \ windows[i:i + batch, 1:])\n               for i in range(0, len(windows), batch)]\n\
    \    return model, optimizer, batches\n\n\ndef telemetry(stop, rows):\n    while\
    \ not stop.is_set():\n        try:\n            sample = subprocess.check_output([\n\
    \                'nvidia-smi', '--query-gpu=timestamp,uuid,utilization.gpu,memory.used,power.draw,temperature.gpu',\n\
    \                '--format=csv,noheader,nounits',\n            ], text=True, timeout=5).strip()\n\
    \            rows.append({'unix_time': time.time(), 'sample': sample})\n     \
    \   except (OSError, subprocess.SubprocessError) as exc:\n            rows.append({'error':\
    \ str(exc)})\n        stop.wait(1)\n\n\ndef main():\n    if not torch.cuda.is_available()\
    \ or not torch.cuda.is_bf16_supported():\n        raise RuntimeError('BF16 CUDA\
    \ device required')\n    output = Path(os.getenv('OUTPUT_DIR', '/results'))\n\
    \    output.mkdir(parents=True, exist_ok=True)\n    source = Path(os.getenv('CORPUS_PATH',\
    \ '/benchmark/corpus.txt')).read_bytes()\n    if len(source) <= SEQ:\n       \
    \ raise ValueError('Corpus too short')\n    corpus = torch.tensor(list(source),\
    \ dtype=torch.long)\n    torch.set_num_threads(2)\n    warmup, measured = 20,\
    \ 40\n    result = {\n        'recorded_at': datetime.now(timezone.utc).isoformat(),\n\
    \        'scope': 'single-L4 small causal LM training on local UTF-8 bytes; not\
    \ pretrained LLM quality',\n        'config': {'seed': SEED, 'sequence_length':\
    \ SEQ, 'hidden': HIDDEN, 'layers': LAYERS,\n                   'heads': 8, 'vocab':\
    \ 256, 'precision': 'BF16 autocast', 'optimizer': 'AdamW',\n                 \
    \  'learning_rate': 3e-4, 'dropout': 0.0, 'warmup': warmup, 'measured_steps':\
    \ measured,\n                   'order': [8, 16, 16, 8, 8, 16], 'token_unit':\
    \ 'UTF-8 byte',\n                   'data_residency': 'preloaded GPU; excludes\
    \ tokenizer/storage/data-loader'},\n        'environment': {'torch': torch.__version__,\
    \ 'cuda': torch.version.cuda,\n                        'gpu': torch.cuda.get_device_name(0),\
    \ 'python': platform.python_version(),\n                        'hostname': platform.node(),\
    \ 'cpu_threads': torch.get_num_threads(),\n                        'nvidia_smi':\
    \ subprocess.check_output(['nvidia-smi'], text=True)},\n        'corpus': {'bytes':\
    \ len(source), 'sha256': hashlib.sha256(source).hexdigest(),\n               \
    \    'source': 'repository README.md snapshot, UTF-8 bytes; 128 fixed windows'},\n\
    \        'runs': [], 'profiles': {},\n    }\n    rows, stop = [], threading.Event()\n\
    \    thread = threading.Thread(target=telemetry, args=(stop, rows), daemon=True)\n\
    \    thread.start()\n    try:\n        for index, batch in enumerate(result['config']['order']):\n\
    \            model, optimizer, batches = prepare(corpus, batch)\n            result['parameter_count']\
    \ = sum(p.numel() for p in model.parameters())\n            if index == 0:\n \
    \               # Changing future tokens must not change prefix logits.\n    \
    \            with torch.no_grad():\n                    x = batches[0][0][:1].clone()\n\
    \                    before = model(x)[:, :32]\n                    x[:, 32:]\
    \ = (x[:, 32:] + 1) % 256\n                    difference = (before - model(x)[:,\
    \ :32]).abs().max().item()\n                    assert difference < 1e-5, difference\n\
    \                    result['causality_check_max_prefix_difference'] = difference\n\
    \                    del before, x\n            initial_loss = float(step(model,\
    \ optimizer, batches, 0))\n            for n in range(warmup):\n             \
    \   step(model, optimizer, batches, n)\n            torch.cuda.synchronize()\n\
    \            torch.cuda.reset_peak_memory_stats()\n            latencies = []\n\
    \            started_at = time.time()\n            for n in range(measured):\n\
    \                start = time.perf_counter()\n                loss = step(model,\
    \ optimizer, batches, n)\n                torch.cuda.synchronize()\n         \
    \       latencies.append((time.perf_counter() - start) * 1000)\n            final_loss\
    \ = float(loss)\n            assert math.isfinite(final_loss)\n            result['runs'].append({\n\
    \                'order_index': index, 'batch_size': batch, 'started_at_unix':\
    \ started_at,\n                'finished_at_unix': time.time(), 'step_ms': latencies,\n\
    \                'mean_step_ms': statistics.fmean(latencies),\n              \
    \  'p95_step_ms': sorted(latencies)[math.ceil(.95 * len(latencies)) - 1],\n  \
    \              'tokens_per_second': batch * SEQ * measured / (sum(latencies) /\
    \ 1000),\n                'peak_allocated_mib': torch.cuda.max_memory_allocated()\
    \ / 2**20,\n                'peak_reserved_mib': torch.cuda.max_memory_reserved()\
    \ / 2**20,\n                'initial_loss': initial_loss, 'final_loss': final_loss,\n\
    \            })\n            del model, optimizer, batches, loss\n           \
    \ torch.cuda.empty_cache()\n            print(f'Measured case {index + 1}/6, batch={batch}',\
    \ flush=True)\n\n        # Profiler overhead is excluded from all throughput numbers\
    \ above.\n        for batch in (8, 16):\n            model, optimizer, batches\
    \ = prepare(corpus, batch)\n            for n in range(warmup):\n            \
    \    step(model, optimizer, batches, n)\n            torch.cuda.synchronize()\n\
    \            with profile(activities=[ProfilerActivity.CPU, ProfilerActivity.CUDA],\n\
    \                         record_shapes=True, profile_memory=True) as prof:\n\
    \                for n in range(5):\n                    step(model, optimizer,\
    \ batches, n)\n                    prof.step()\n                torch.cuda.synchronize()\n\
    \            events = prof.key_averages()\n            operators = [{'name': e.key,\
    \ 'calls': e.count,\n                          'self_cpu_us': e.self_cpu_time_total,\n\
    \                          'self_device_us': e.self_device_time_total,\n     \
    \                     'device_total_us': e.device_time_total}\n              \
    \           for e in events]\n            operators.sort(key=lambda e: e['self_device_us'],\
    \ reverse=True)\n            assert sum(e['self_device_us'] for e in operators)\
    \ > 0, 'CUDA profiler events absent'\n            result['profiles'][str(batch)]\
    \ = {'steps': 5, 'operators': operators}\n            prof.export_chrome_trace(str(output\
    \ / f'batch{batch}.trace.json'))\n            with gzip.open(output / f'batch{batch}.trace.json.gz',\
    \ 'wb') as f:\n                f.write((output / f'batch{batch}.trace.json').read_bytes())\n\
    \            del model, optimizer, batches, prof, events\n            torch.cuda.empty_cache()\n\
    \    finally:\n        stop.set()\n        thread.join(timeout=6)\n        result['telemetry']\
    \ = rows\n        (output / 'result.json').write_text(json.dumps(result, indent=2)\
    \ + '\\n')\n    print('BENCHMARK_COMPLETE', flush=True)\n\n\nif __name__ == '__main__':\n\
    \    main()\n"
