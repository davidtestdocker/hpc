    \ Kueue admission blockage\u3002\n\n## Performance\n\n\u56FA\u5B9A 128 requests\
    \ \u7684 vLLM \u7D50\u679C\u4E2D\uFF0Cconcurrency 16\uFF0F32\uFF0F64 \u7684 throughput\
    \ \u70BA **16.748\uFF0F24.988\uFF0F32.379 req/s**\uFF1Bmean TTFT \u70BA **135.601\uFF0F\
    188.663\uFF0F448.579 ms**\u300232 \u2192 64 \u7684 throughput \u589E\u52A0 29.6%\uFF0C\
    TTFT \u589E\u52A0 137.8%\uFF0C\u5448\u73FE\u6B64 workload \u7684 latency tradeoff\u3002\
    \n\n2026-09-21 \u5728 L4 time-sharing share \u91CD\u8DD1 BF16 synthetic Transformer\
    \ training\uFF1Abatch 8\u219216 \u7684 mean token throughput \u70BA **101,096\u2192\
    176,335 tokens/s\uFF08+74.4%\uFF09**\uFF0Cmean step latency **+14.0%**\uFF0Cpeak\
    \ allocated memory **+50.8%**\u3002\u6BCF\u7D44\u5305\u542B 10 warmup \u8207 3\xD7\
    20 measured steps\uFF1B\u8A73\u898B [\u6BD4\u8F03\u5831\u544A](docs/performance/transformer-training-l4-20260921.md)\u3002\
    \n\n\u53E6\u4FDD\u5B58 stress-ng CPU saturation\u3001fio ephemeral-storage baseline\u3001\
    \u540C node iperf3\u3001CPU\uFF0FGloo DDP profiling\u3001\u55AE GPU NCCL fallback\uFF0C\
    \u4EE5\u53CA\u6B77\u53F2 P100 DCGM dashboard evidence\u3002\u5B83\u5011\u4F86\u81EA\
    \u4E0D\u540C\u74B0\u5883\uFF0C\u672A\u7531\u4E3B E2E \u81EA\u52D5\u56DE\u6536\u3002\
