# Kustomize gpu-sg-platform 環境設定：組合資源或覆寫部署欄位；相對路徑以此檔所在目錄為準。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: apps/v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: Deployment
# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: api
# 期望狀態；控制器據此建立或調整實際資源。
spec:
  # 子物件模板；控制器以此內容建立 Pod 或相關工作資源。
  template:
    spec:
      # Pod 使用的 ServiceAccount；RBAC 依此身分授予 API 權限。
      serviceAccountName: api-jobset-runner
