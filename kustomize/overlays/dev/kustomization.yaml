apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hpc-platform-dev


helmGlobals:
  chartHome: ../../../helm

helmCharts:
  #name api 代表 helm/api
  - name: api
    releaseName: api
    namespace: hpc-platform-dev
    valuesFile: ../../../helm/api/values-dev.yaml
    includeCRDs: false

  - name: redis
    releaseName: redis
    namespace: hpc-platform-dev
    includeCRDs: false

  - name: postgres
    releaseName: postgres
    namespace: hpc-platform-dev
    includeCRDs: false

  - name: prometheus
    releaseName: prometheus
    namespace: hpc-platform-dev
    includeCRDs: false

  - name: prometheus-node-exporter
    repo: https://prometheus-community.github.io/helm-charts
    version: 4.56.1
    releaseName: node-exporter
    namespace: hpc-platform-dev

patches:
  - path: deployment-patch.yaml

