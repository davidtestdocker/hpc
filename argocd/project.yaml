# Argo CD 設定（project）：用於 GitOps 部署；既有 dev Application 指向舊 overlays/dev。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: argoproj.io/v1alpha1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: AppProject

# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: hpc-platform
  # 資源所屬命名空間；叢集層級資源不使用此欄位。
  namespace: argocd

# 期望狀態；控制器據此建立或調整實際資源。
spec:

  description: HPC AI Benchmark Platform

  sourceRepos:
    - https://github.com/davidtestdocker/hpc.git

  destinations:
    - namespace: hpc-platform-dev
      server: https://kubernetes.default.svc

    - namespace: hpc-platform-stage
      server: https://kubernetes.default.svc

    - namespace: hpc-platform-prod
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    # 目前允許所有 cluster-scoped 類型；這是寬鬆 demo 設定，不是最小權限示範。
    - group: "*"
      kind: "*"

  namespaceResourceWhitelist:
    # namespace 目的地受上方 destinations 限制，但資源類型仍全部允許。
    - group: "*"
      kind: "*"
