# Argo CD 設定（ingress）：用於 GitOps 部署；既有 dev Application 指向舊 overlays/dev。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: networking.k8s.io/v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: Ingress

# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: argocd-ingress
  # 資源所屬命名空間；叢集層級資源不使用此欄位。
  namespace: argocd
  # 附加設定或提示，由對應控制器解讀，不等同 selector 標籤。
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"

# 期望狀態；控制器據此建立或調整實際資源。
spec:
  ingressClassName: traefik

  # 規則清單；RBAC 中定義 API 存取權限，Ingress 中定義路由。
  rules:
    - host: argocd.hpc.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
