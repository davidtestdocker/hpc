# Argo CD 設定（argocd-cm）：用於 GitOps 部署；既有 dev Application 指向舊 overlays/dev。
# 語法：縮排表示階層，key: value 是鍵值，- 表示清單項目；# 後方是註解。
#此檔案室argocd 用來改變自己的行為，告訴 Repo Server 執行 Kustomize 時，要加哪些參數
# 資源所屬 API 群組與版本；Helm Chart 中則是 Chart 格式版本。
apiVersion: v1
# 資源種類，決定由哪個 Kubernetes 控制器或工具處理。
kind: ConfigMap

# 資源識別資訊；name 與 namespace 決定命名空間內的身分。
metadata:
  name: argocd-cm
  # 資源所屬命名空間；叢集層級資源不使用此欄位。
  namespace: argocd
  # 鍵值標籤，供 selector、監控或排程控制器識別資源。
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd

# 鍵值資料；Secret 的 data 使用 Base64 編碼，ConfigMap 通常是純文字。
data:
  # 多行純量：| 保留換行，> 折疊換行；內容由接收程式解讀。
  kustomize.buildOptions: >-
    --enable-helm
    --load-restrictor LoadRestrictionsNone
